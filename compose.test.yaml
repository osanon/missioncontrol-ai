services:
  tests:
    build:
      context: .
      dockerfile: docker/test.Dockerfile
    environment:
      MC_TEST_DATABASE_URL: postgresql+psycopg://mc_admin:${POSTGRES_PASSWORD}@db:5432/missioncontrol
      MC_TEST_READ_DATABASE_URL: postgresql+psycopg://mc_reader:${READER_PASSWORD}@db:5432/missioncontrol
      MC_TEST_APP_DATABASE_URL: postgresql+psycopg://mc_app:${APP_DB_PASSWORD}@db:5432/missioncontrol
    depends_on:
      seed: {condition: service_completed_successfully}
