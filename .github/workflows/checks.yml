# Runs on every pull request and every push to main. All jobs must pass before merging.
name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Lint and tests (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            tests/requirements.txt
      - run: python -m pip install -r tests/requirements.txt
      - run: ruff check .
      - run: python -m pytest -q

  postgres:
    name: Tests (PostgreSQL, real database roles)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Generates throwaway passwords for this run only; the database is deleted afterwards.
      - run: python3 scripts/configure.py
      - run: bash scripts/check-review-update.sh

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
